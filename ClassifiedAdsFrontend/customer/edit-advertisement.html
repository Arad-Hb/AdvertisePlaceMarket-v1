<!doctype html>
<html lang="fa" dir="rtl" data-app-root="../">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ویرایش آگهی | تحلیل داده آگهی</title>
<link rel="icon" href="../assets/images/logo/tahlildadeh-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/variables.css"><link rel="stylesheet" href="../assets/css/base.css"><link rel="stylesheet" href="../assets/css/components.css"><link rel="stylesheet" href="../assets/css/panel-layout.css"><link rel="stylesheet" href="../assets/css/panel-pages/common.css">
</head>
<body class="panel-page" data-panel-role="Customer" data-panel-page="advertisements">
<div id="panelSidebarRoot"></div><div id="panelHeaderRoot"></div>
<div class="panel-main"><main class="panel-content">
<header class="panel-page-head is-sticky"><div><h1>ویرایش آگهی</h1><p class="ad-form-note">آگهی ابتدا پیش‌نویس می‌شود؛ پس از ذخیره تصویر اضافه کنید و در پایان برای بررسی مدیر ارسال نمایید.</p></div><div class="panel-page-head__actions"><a class="btn-panel-soft" href="advertisements.html">بازگشت به آگهی‌ها</a></div></header>
<div class="ad-form-layout"><section><form id="advertisementForm" class="panel-form"><div class="panel-form-section"><div class="panel-form-section__title"><span id="basicIcon"></span>اطلاعات اصلی</div><div class="mb-3"><label class="form-label">عنوان آگهی *</label><input class="form-control" name="title" maxlength="150" required></div><div class="row g-3"><div class="col-md-6"><label class="form-label">دسته‌بندی *</label><select class="form-select js-select-menu" id="adCategory" name="advertisementCategoryID" data-icon="grid" data-icon-color="#28a9f5" required></select></div><div class="col-md-6"><label class="form-label">قیمت (تومان)</label><input class="form-control" name="price" type="number" min="0"></div><div class="col-md-6"><label class="form-label">استان *</label><select class="form-select js-select-menu" id="adProvince" name="provinceID" data-icon="pin" data-icon-color="#FF6500" required></select></div><div class="col-md-6"><label class="form-label">شهر *</label><select class="form-select js-select-menu" id="adCity" name="cityID" data-icon="pin" data-icon-color="#25c46a" disabled required></select></div><div class="col-md-6"><label class="form-label">شماره تماس *</label><input class="form-control" name="phoneNumber" inputmode="tel" pattern="^09[0-9]{9}$" required></div><div class="col-md-6 d-flex align-items-end"><label class="panel-switch pb-2"><input class="form-check-input" type="checkbox" name="isImmediate"><span>آگهی فوری باشد</span></label></div></div><div class="mt-3"><label class="form-label">توضیحات *</label><textarea class="form-control" name="description" maxlength="4000" required></textarea></div></div>
<div class="ad-form-lower"><div class="panel-form-section" id="imageSection"><div class="panel-form-section__title"><span id="imageIcon"></span>تصاویر آگهی</div><div class="ad-image-row"><button class="btn-panel-primary ad-image-add" id="openImageModal" type="button" disabled>افزودن عکس</button><div class="ad-image-thumbs" id="imageGallery"></div></div></div><div class="user-summary-card"><h3 class="h6 fw-bold mb-3">مشخصات کاربری</h3><div class="user-summary-row"><span>نام کاربری</span><strong data-current-user-name>-</strong></div><div class="user-summary-row"><span>شماره موبایل</span><strong id="currentUserMobile">-</strong></div></div></div>
<div class="d-flex flex-wrap gap-2"><button class="btn-panel-primary" id="saveAdButton" type="submit">ذخیره تغییرات</button><button class="btn-panel-success d-none" id="submitAdButton" type="button">ارسال برای بررسی</button></div></form></section></div></main><div id="panelFooterRoot"></div></div>
<div class="modal fade" id="imageUploadModal" tabindex="-1" aria-labelledby="imageUploadModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="imageUploadModalTitle">افزودن عکس</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="بستن"></button>
      </div>
      <div class="modal-body">
        <label class="panel-upload-box">
          <div class="mb-2" id="uploadIcon"></div>
          <strong>تصاویر را انتخاب کنید</strong>
          <p class="image-help">فرمت‌های مجاز و محدودیت حجم توسط API بررسی می‌شوند.</p>
          <input class="form-control mt-3" id="adImages" type="file" accept="image/jpeg,image/png,image/webp" multiple>
        </label>
        <div class="panel-gallery mt-3" id="modalImagePreview"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-panel-soft" data-bs-dismiss="modal">انصراف</button>
        <button type="button" class="btn-panel-primary" id="confirmImagesButton">تأیید</button>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/axios@1.12.2/dist/axios.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/config.js"></script><script src="../assets/js/api.js"></script><script src="../assets/js/auth.js"></script><script src="../assets/js/ui.js"></script><script src="../assets/js/select-menu.js"></script><script src="../assets/js/panel-ui.js"></script><script src="../assets/js/persian-date-picker.js"></script><script src="../assets/js/categories.js"></script><script src="../assets/js/location.js"></script><script src="../assets/js/panel-layout.js"></script>
<script src="../assets/js/customer/customer-ad-form.js"></script>
</body></html>
